# Generated by agentic. Edit .agentic/config.yaml and run `agentic update`; manual
# edits to this generated file are reported as conflicts.
name: Agentic code-scanning-remediation intake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Discover and print work requests without creating anything
        required: false
        type: boolean
        default: false

# security-events: read lists the findings. issues: write creates and assigns
# the work item. AGENT_GITHUB_TOKEN must be a user-to-server token when Copilot
# execution is selected. Nothing here may write to a finding, merge, or deploy.
permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: agentic-code-scanning-remediation-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: "ubuntu-latest"
    env:
      # AGENT_GITHUB_TOKEN is the repository secret; AGENTIC_GITHUB_TOKEN is
      # the internal process variable consumed by generated adapters.
      AGENTIC_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      AGENTIC_DRY_RUN: ${{ inputs.dry-run }}
      AGENTIC_PIPELINE: "code-scanning-remediation"

    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Set up Node.js
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"

      - name: Discover and dispatch eligible work
        run: node scripts/agentic/pipelines/code-scanning-remediation/intake.mjs
