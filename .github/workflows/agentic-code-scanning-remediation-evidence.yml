# Generated by agentic. Edit .agentic/config.yaml and run `agentic update`; manual
# edits to this generated file are reported as conflicts.
name: Agentic code-scanning-remediation evidence

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

# pull-requests: write publishes the evidence comment. The job never merges.
# This trusted event runs the workflow from the base revision. Repository checks
# run separately with no provider permissions; the evidence job only queries APIs.
permissions:
  contents: none
  security-events: none
  pull-requests: none

concurrency:
  group: agentic-code-scanning-remediation-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: code-scanning-remediation candidate classification
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: "ubuntu-latest"
    outputs:
      candidate: ${{ steps.classify.outputs.candidate }}
      trusted: ${{ steps.classify.outputs.trusted }}
    steps:
      - name: Checkout trusted automation
        uses: "actions/checkout@v7"
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .agentic-trusted
          persist-credentials: false

      - name: Set up Node.js
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"

      - name: Classify the pull request from provider metadata
        id: classify
        env:
          AGENTIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .agentic-trusted/scripts/agentic/pipelines/code-scanning-remediation/candidate-run.mjs

  checks:
    name: code-scanning-remediation repository checks
    needs: candidate
    if: needs.candidate.result == 'success' && needs.candidate.outputs.trusted == 'true'
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout trusted automation
        uses: "actions/checkout@v7"
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .agentic-trusted
          persist-credentials: false

      - name: Checkout the proposed change
        uses: "actions/checkout@v7"
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .agentic-change
          persist-credentials: false

      - name: Set up Node.js
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"

      - name: Run repository checks without provider credentials
        env:
          AGENTIC_REPOSITORY_PATH: ${{ github.workspace }}/.agentic-change
        run: node .agentic-trusted/scripts/agentic/pipelines/code-scanning-remediation/checks-run.mjs

  evidence:
    name: code-scanning-remediation evidence decision
    timeout-minutes: 15
    needs: [candidate, checks]
    if: always()
    permissions:
      contents: read
      issues: read
      security-events: read
      pull-requests: write
    runs-on: "ubuntu-latest"
    env:
      # Evidence only needs the least-privilege workflow token. The user token
      # is reserved for intake, where it starts the Copilot assignment.
      AGENTIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      AGENTIC_PIPELINE: "code-scanning-remediation"
      AGENTIC_CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      AGENTIC_CHECKS_RESULT: ${{ needs.checks.result }}
      AGENTIC_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AGENTIC_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AGENTIC_EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Fail closed when candidate classification fails
        if: needs.candidate.result != 'success'
        run: |
          echo "Trusted candidate classification failed; evidence cannot be established." >&2
          exit 1

      - name: Ignore unrelated pull request
        if: needs.candidate.result == 'success' && needs.candidate.outputs.candidate != 'true'
        run: echo "This pull request does not belong to the code-scanning-remediation pipeline."

      # The workflow and runner code come from the trusted base branch. This job
      # does not execute code from the proposed revision.
      - name: Checkout trusted automation
        if: needs.candidate.result == 'success' && needs.candidate.outputs.candidate == 'true'
        uses: "actions/checkout@v7"
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .agentic-trusted
          persist-credentials: false

      - name: Set up Node.js
        if: needs.candidate.result == 'success' && needs.candidate.outputs.candidate == 'true'
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"

      - name: Assert evidence and publish confidence
        if: needs.candidate.result == 'success' && needs.candidate.outputs.candidate == 'true'
        run: node .agentic-trusted/scripts/agentic/pipelines/code-scanning-remediation/evidence-run.mjs

  status:
    name: code-scanning-remediation head status
    needs: [candidate, checks, evidence]
    if: always()
    permissions:
      statuses: write
    runs-on: "ubuntu-latest"
    steps:
      - name: Publish the required status on the pull request head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AGENTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENTIC_CANDIDATE_RESULT: ${{ needs.candidate.result }}
          AGENTIC_IS_CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          AGENTIC_CHECKS_RESULT: ${{ needs.checks.result }}
          AGENTIC_EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          state=failure
          description="Agentic evidence could not be established"
          if [ "$AGENTIC_CANDIDATE_RESULT" = "success" ] && \
             [ "$AGENTIC_EVIDENCE_RESULT" = "success" ] && \
             { [ "$AGENTIC_CHECKS_RESULT" = "success" ] || [ "$AGENTIC_CHECKS_RESULT" = "skipped" ]; }; then
            state=success
            description="Agentic evidence completed"
          fi
          if [ "$AGENTIC_CANDIDATE_RESULT" = "success" ] && \
             [ "$AGENTIC_IS_CANDIDATE" != "true" ]; then
            description="Not a code-scanning-remediation candidate"
          fi
          gh api --method POST "/repos/$GH_REPO/statuses/$AGENTIC_HEAD_SHA" \
            -f state="$state" \
            -f context=code-scanning-remediation-evidence \
            -f description="$description"
